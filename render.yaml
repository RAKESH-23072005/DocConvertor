services:
  - type: web
    name: docconvertor-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_API_DOCS
        value: "false"
      - key: TEMP_DIR
        value: /tmp/docconvertor
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: FILE_RETENTION_SECONDS
        value: "3600"
      - key: CONVERSION_TIMEOUT_SECONDS
        value: "120"
      - key: MAX_CONCURRENT_CONVERSIONS
        value: "1"
      - key: CORS_ORIGINS
        sync: false
